[project]
name = "reese-ag"
version = "0.1.0"
description = "AI 网文生成器 — 多 Agent 协作的长篇小说生成系统"
requires-python = ">=3.11"

[project.optional-dependencies]
epub = ["ebooklib>=0.18"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
